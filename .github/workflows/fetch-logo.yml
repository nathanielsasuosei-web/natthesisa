name: Fetch the brand logo

# One-off utility. The agent's sandbox cannot reach i.imgur.com, but a runner
# can, so this workflow downloads the logo the owner supplied and commits the
# bytes into the repository. It is removed again once the asset is in place.

on:
  push:
    paths:
      - ".github/workflows/fetch-logo.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a10cfe-natthesisa
          fetch-depth: 1

      - name: Download the supplied image
        run: |
          set -euo pipefail
          mkdir -p public/branding
          ok=0
          for url in \
            "https://i.imgur.com/A4jvkPc.png" \
            "https://i.imgur.com/A4jvkPc.jpg" \
            "https://i.imgur.com/A4jvkPc.webp" \
            "https://i.imgur.com/A4jvkPc_d.webp?maxwidth=760&fidelity=grand"
          do
            echo "trying: $url"
            if curl -fsSL --max-time 90 -A "Mozilla/5.0 (codemasterghana logo fetch)" "$url" -o /tmp/logo.bin; then
              size=$(stat -c%s /tmp/logo.bin)
              kind=$(file -b /tmp/logo.bin)
              echo "downloaded ${size} bytes: ${kind}"
              if [ "$size" -gt 200 ] && echo "$kind" | grep -qiE 'image|png|jpeg|webp|gif'; then
                cp /tmp/logo.bin /tmp/logo.orig
                echo "LOGO_URL=$url"
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" != "1" ]; then echo "Could not download the image"; exit 1; fi

      - name: Inspect it
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          identify /tmp/logo.orig || true
          echo "format: $(identify -format '%m %wx%h' /tmp/logo.orig 2>/dev/null || echo unknown)"

      - name: Save it in the repository
        run: |
          set -euo pipefail
          mkdir -p public/branding
          ext=$(identify -format '%m' /tmp/logo.orig 2>/dev/null | tr 'A-Z' 'a-z' || echo png)
          case "$ext" in
            jpeg|jpg) ext=jpg ;;
            png|webp|gif) : ;;
            *) ext=png ;;
          esac
          cp /tmp/logo.orig "public/branding/logo-original.${ext}"
          if command -v convert >/dev/null 2>&1; then
            convert /tmp/logo.orig -background none -resize '1024x1024>' public/branding/logo.png
            convert /tmp/logo.orig -background none -resize '256x256>' public/branding/logo-256.png
          else
            cp /tmp/logo.orig public/branding/logo.png
          fi
          ls -la public/branding
          identify public/branding/logo.png public/branding/logo-256.png 2>/dev/null || true

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "codemasterghana bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/branding
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "Add the brand logo from the supplied image"
          git push origin HEAD:arena/01a10cfe-natthesisa
          echo "pushed=true"

      - name: Print the bytes (fallback if the push was refused)
        if: always()
        run: |
          if [ -f /tmp/logo.orig ]; then
            echo "LOGO_BYTES=$(stat -c%s /tmp/logo.orig)"
            echo "LOGO_B64_BEGIN"
            base64 -w 200 /tmp/logo.orig
            echo "LOGO_B64_END"
          fi
